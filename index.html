<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Asistente de inventario</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 40px;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #34a853;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #resultado {
      margin-top: 25px;
      padding: 20px;
      background: #f1f1f1;
      border-radius: 10px;
      min-height: 50px;
      white-space: pre-line;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <h1>🤖 Asistente de inventario</h1>

    <p>
      Pulsa el botón y haz una pregunta.
    </p>

    <button id="hablar">
      🎤 Hablar
    </button>

    <div id="resultado">
      Esperando...
    </div>

  </div>


  <script>

  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbz6pHkAI7LKagEK_jw7LcWfMw9RHS24d-gA5l1bgSdfiyCsUIXn8H6QDq7HWWTZARrVTw/exec";

  const boton = document.getElementById("hablar");
  const resultado = document.getElementById("resultado");

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  // ==========================================
  // COMPROBAR RECONOCIMIENTO DE VOZ
  // ==========================================

  if (!SpeechRecognition) {

    resultado.innerText =
      "❌ Tu navegador no permite reconocimiento de voz.";

    boton.disabled = true;

  } else {

    const reconocimiento =
      new SpeechRecognition();

    reconocimiento.lang = "es-CO";
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;
    reconocimiento.maxAlternatives = 1;


    // ========================================
    // BOTÓN HABLAR
    // ========================================

    boton.addEventListener("click", function() {

      resultado.innerText =
        "🎙️ Escuchando...\n\nHabla ahora.";

      boton.disabled = true;

      try {

        reconocimiento.start();

      } catch (error) {

        console.log(error);

      }

    });


    // ========================================
    // RESULTADO DE VOZ
    // ========================================

    reconocimiento.addEventListener(
      "result",
      async function(event) {

        const texto =
          event.results[0][0].transcript;

        resultado.innerText =
          "🗣️ Pregunta:\n\n" +
          texto +
          "\n\n⏳ Consultando inventario...";


        try {

const datos =
  await consultarChatbot(texto);


          if (datos.error) {

            throw new Error(datos.error);

          }


          resultado.innerText =
  "🗣️ Pregunta:\n\n" +
  texto +
  "\n\n💬 Respuesta:\n\n" +
  datos.respuesta;

// 🔊 Leer la respuesta en voz alta
const voz = new SpeechSynthesisUtterance(datos.respuesta);

voz.lang = "es-CO";
voz.rate = 1;
voz.pitch = 1;

speechSynthesis.cancel();
speechSynthesis.speak(voz);
          console.log("🔊 Intentando hablar:", datos.respuesta);


        } catch (error) {

          console.error(error);

          resultado.innerText =
            "❌ No se pudo conectar con el chatbot.\n\n" +
            error.message;

        }


        boton.disabled = false;

      }
    );

    async function consultarChatbot(pregunta) {

  return new Promise(function(resolve, reject) {

    const nombreCallback =
      "respuestaChatbot_" +
      Date.now();

    window[nombreCallback] =
      function(datos) {

        delete window[nombreCallback];

        resolve(datos);

      };


    const script =
      document.createElement("script");


    const url =
      URL_APPS_SCRIPT +
      "?pregunta=" +
      encodeURIComponent(pregunta) +
      "&callback=" +
      nombreCallback;


    script.src = url;


    script.onerror =
      function() {

        delete window[nombreCallback];

        reject(
          new Error(
            "No se pudo conectar con Apps Script."
          )
        );

      };


    document.body.appendChild(script);


    setTimeout(function() {

      if (window[nombreCallback]) {

        delete window[nombreCallback];

        reject(
          new Error(
            "Apps Script tardó demasiado en responder."
          )
        );

      }

    }, 30000);

  });

}

    // ========================================
    // ERROR
    // ========================================

    reconocimiento.addEventListener(
      "error",
      function(event) {

        resultado.innerText =
          "❌ Error de reconocimiento:\n\n" +
          event.error;

        boton.disabled = false;

      }
    );


    // ========================================
    // FINALIZAR
    // ========================================

    reconocimiento.addEventListener(
      "end",
      function() {

        boton.disabled = false;

      }
    );

  }

</script>
</body>

</html>
