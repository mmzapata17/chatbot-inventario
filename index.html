<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Asistente de inventario</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 40px;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #34a853;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #resultado {
      margin-top: 25px;
      padding: 20px;
      background: #f1f1f1;
      border-radius: 10px;
      min-height: 50px;
      white-space: pre-line;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <h1>🤖 Asistente de inventario</h1>

    <p>
      Pulsa el botón y haz una pregunta.
    </p>

    <button id="hablar">
      🎤 Hablar
    </button>

    <div id="resultado">
      Esperando...
    </div>

  </div>


  <script>

  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbz6pHkAI7LKagEK_jw7LcWfMw9RHS24d-gA5l1bgSdfiyCsUIXn8H6QDq7HWWTZARrVTw/exec";

  const boton = document.getElementById("hablar");
  const resultado = document.getElementById("resultado");

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  // ==========================================
  // COMPROBAR RECONOCIMIENTO DE VOZ
  // ==========================================

  if (!SpeechRecognition) {

    resultado.innerText =
      "❌ Tu navegador no permite reconocimiento de voz.";

    boton.disabled = true;

  } else {

    const reconocimiento =
      new SpeechRecognition();

    reconocimiento.lang = "es-CO";
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;
    reconocimiento.maxAlternatives = 1;


    // ========================================
    // BOTÓN HABLAR
    // ========================================

    boton.addEventListener("click", function() {

      resultado.innerText =
        "🎙️ Escuchando...\n\nHabla ahora.";

      boton.disabled = true;

      try {

        reconocimiento.start();

      } catch (error) {

        console.log(error);

      }

    });


    // ========================================
    // RESULTADO DE VOZ
    // ========================================

    reconocimiento.addEventListener(
      "result",
      async function(event) {

        const texto =
          event.results[0][0].transcript;

        resultado.innerText =
          "🗣️ Pregunta:\n\n" +
          texto +
          "\n\n⏳ Consultando inventario...";


        try {

const datos =
  await consultarChatbot(texto);


          if (datos.error) {

            throw new Error(datos.error);

          }


          resultado.innerText =
  "🗣️ Pregunta:\n\n" +
  texto +
  "\n\n💬 Respuesta:\n\n" +
  datos.respuesta;

// 🔊 Leer la respuesta en voz alta
// 🔊 Preparar respuesta para voz
let textoVoz = datos.respuesta;

// 🔇 Eliminar asteriscos para la voz
textoVoz = textoVoz.replace(/\*/g, "");

console.log("RESPUESTA ORIGINAL:", datos.respuesta);

textoVoz = convertirPreciosAVoz(textoVoz);

console.log("RESPUESTA PARA VOZ:", textoVoz);
          
// Convertir precios como $45.000 a palabras
textoVoz = convertirPreciosAVoz(textoVoz);

const voz =
  new SpeechSynthesisUtterance(textoVoz);

voz.lang = "es-CO";
voz.rate = 0.95;
voz.pitch = 1;

speechSynthesis.cancel();
speechSynthesis.speak(voz);
          console.log("🔊 Intentando hablar:", datos.respuesta);


        } catch (error) {

          console.error(error);

          resultado.innerText =
            "❌ No se pudo conectar con el chatbot.\n\n" +
            error.message;

        }


        boton.disabled = false;

      }
    );

    async function consultarChatbot(pregunta) {

  return new Promise(function(resolve, reject) {

    const nombreCallback =
      "respuestaChatbot_" +
      Date.now();

    window[nombreCallback] =
      function(datos) {

        delete window[nombreCallback];

        resolve(datos);

      };


    const script =
      document.createElement("script");


    const url =
      URL_APPS_SCRIPT +
      "?pregunta=" +
      encodeURIComponent(pregunta) +
      "&callback=" +
      nombreCallback;


    script.src = url;


    script.onerror =
      function() {

        delete window[nombreCallback];

        reject(
          new Error(
            "No se pudo conectar con Apps Script."
          )
        );

      };


    document.body.appendChild(script);


    setTimeout(function() {

      if (window[nombreCallback]) {

        delete window[nombreCallback];

        reject(
          new Error(
            "Apps Script tardó demasiado en responder."
          )
        );

      }

    }, 30000);

  });

}

    // ========================================
    // ERROR
    // ========================================

    reconocimiento.addEventListener(
      "error",
      function(event) {

        resultado.innerText =
          "❌ Error de reconocimiento:\n\n" +
          event.error;

        boton.disabled = false;

      }
    );


    // ========================================
    // FINALIZAR
    // ========================================

    reconocimiento.addEventListener(
      "end",
      function() {

        boton.disabled = false;

      }
    );

  }

    // ==========================================
// 💰 CONVERTIR PRECIOS A VOZ
// ==========================================

function convertirPreciosAVoz(texto) {

  return texto.replace(
    /\$+\s*([\d.]+)/g,
    function(_, numero) {

      const valor =
        parseInt(numero.replace(/\./g, ""), 10);

      if (isNaN(valor)) {
        return numero;
      }

      return numeroATexto(valor) + " pesos";
    }
  );

}


// ==========================================
// 🔢 CONVERTIR NÚMEROS A PALABRAS
// ==========================================

function numeroATexto(numero) {

  if (numero === 0) {
    return "cero";
  }

  if (numero < 1000) {
    return unidades(numero);
  }

  if (numero < 1000000) {

    const miles =
      Math.floor(numero / 1000);

    const resto =
      numero % 1000;

    let resultado;

    if (miles === 1) {
      resultado = "mil";
    } else {
      resultado =
        numeroATexto(miles) + " mil";
    }

    if (resto > 0) {
      resultado +=
        " " + numeroATexto(resto);
    }

    return resultado;
  }

  return numero.toLocaleString("es-CO");
}


// ==========================================
// 🔤 NÚMEROS DEL 1 AL 999
// ==========================================

function unidades(numero) {

  const numeros = [
    "",
    "uno",
    "dos",
    "tres",
    "cuatro",
    "cinco",
    "seis",
    "siete",
    "ocho",
    "nueve",
    "diez",
    "once",
    "doce",
    "trece",
    "catorce",
    "quince",
    "dieciséis",
    "diecisiete",
    "dieciocho",
    "diecinueve",
    "veinte"
  ];

  if (numero <= 20) {
    return numeros[numero];
  }

  if (numero < 30) {

    return "veinti" +
      numeros[numero - 20];
  }

  const decenas = [
    "",
    "",
    "veinte",
    "treinta",
    "cuarenta",
    "cincuenta",
    "sesenta",
    "setenta",
    "ochenta",
    "noventa"
  ];

  if (numero < 100) {

    const decena =
      Math.floor(numero / 10);

    const unidad =
      numero % 10;

    if (unidad === 0) {
      return decenas[decena];
    }

    return (
      decenas[decena] +
      " y " +
      numeros[unidad]
    );
  }

  const centenas = [
    "",
    "ciento",
    "doscientos",
    "trescientos",
    "cuatrocientos",
    "quinientos",
    "seiscientos",
    "setecientos",
    "ochocientos",
    "novecientos"
  ];

  if (numero === 100) {
    return "cien";
  }

  const centena =
    Math.floor(numero / 100);

  const resto =
    numero % 100;

  if (resto === 0) {
    return centenas[centena];
  }

  return (
    centenas[centena] +
    " " +
    unidades(resto)
  );
}

</script>
</body>

</html>
