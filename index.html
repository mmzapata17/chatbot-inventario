<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Asistente de inventario</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 40px;
    }

    .contenedor {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #34a853;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #resultado {
      margin-top: 25px;
      padding: 20px;
      background: #f1f1f1;
      border-radius: 10px;
      min-height: 50px;
      white-space: pre-line;
    }

  </style>

</head>


<body>

  <div class="contenedor">

    <h1>🤖 Asistente de inventario</h1>

    <p>
      Pulsa el botón y haz una pregunta.
    </p>

    <button id="hablar">
      🎤 Hablar
    </button>

    <div id="resultado">
      Esperando...
    </div>

  </div>


  <script>

  const URL_APPS_SCRIPT = "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT";

  const boton = document.getElementById("hablar");
  const resultado = document.getElementById("resultado");

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  // ==========================================
  // COMPROBAR RECONOCIMIENTO DE VOZ
  // ==========================================

  if (!SpeechRecognition) {

    resultado.innerText =
      "❌ Tu navegador no permite reconocimiento de voz.";

    boton.disabled = true;

  } else {

    const reconocimiento =
      new SpeechRecognition();

    reconocimiento.lang = "es-CO";
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;
    reconocimiento.maxAlternatives = 1;


    // ========================================
    // BOTÓN HABLAR
    // ========================================

    boton.addEventListener("click", function() {

      resultado.innerText =
        "🎙️ Escuchando...\n\nHabla ahora.";

      boton.disabled = true;

      try {

        reconocimiento.start();

      } catch (error) {

        console.log(error);

      }

    });


    // ========================================
    // RESULTADO DE VOZ
    // ========================================

    reconocimiento.addEventListener(
      "result",
      async function(event) {

        const texto =
          event.results[0][0].transcript;

        resultado.innerText =
          "🗣️ Pregunta:\n\n" +
          texto +
          "\n\n⏳ Consultando inventario...";


        try {

          const respuesta =
            await fetch(
              URL_APPS_SCRIPT,
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json"
                },

                body: JSON.stringify({
                  pregunta: texto
                })
              }
            );


          const datos =
            await respuesta.json();


          if (datos.error) {

            throw new Error(datos.error);

          }


          resultado.innerText =
            "🗣️ Pregunta:\n\n" +
            texto +
            "\n\n💬 Respuesta:\n\n" +
            datos.respuesta;


        } catch (error) {

          console.error(error);

          resultado.innerText =
            "❌ No se pudo conectar con el chatbot.\n\n" +
            error.message;

        }


        boton.disabled = false;

      }
    );


    // ========================================
    // ERROR
    // ========================================

    reconocimiento.addEventListener(
      "error",
      function(event) {

        resultado.innerText =
          "❌ Error de reconocimiento:\n\n" +
          event.error;

        boton.disabled = false;

      }
    );


    // ========================================
    // FINALIZAR
    // ========================================

    reconocimiento.addEventListener(
      "end",
      function() {

        boton.disabled = false;

      }
    );

  }

</script>
</body>

</html>
